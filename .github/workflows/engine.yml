# The engine's own CI: its tests (fixture books), then the starter book built and
# checked through its shim, as a book that uses the engine would be. No secrets.

name: Engine tests and starter book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live, poppler, aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-fonts-extra \
            lmodern \
            poppler-utils aspell aspell-en

      - name: Install Pandoc 3.1.3
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache MathJax
        uses: actions/cache@v4
        with:
          path: ~/.cache/book-engine
          key: book-engine-mathjax-3.2.2

      - name: Check tools
        run: ./build.py doctor

      - name: Engine tests
        run: python -m unittest discover -s tests

      - name: Build the starter book (website and PDFs)
        working-directory: starter
        run: ./build.py all

      - name: Check the starter book
        working-directory: starter
        run: ./build.py check

      - name: Starter book tests
        working-directory: starter
        run: python -m unittest discover -s tests
